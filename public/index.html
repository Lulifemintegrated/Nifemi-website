<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nifemi's home on the web." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>N</text></svg>" />
    <title>Nifemi</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18251e;
        background: #f3f0e8;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      .shell {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        padding: 32px clamp(24px, 6vw, 88px);
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .wordmark {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #46584d;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #bc5b35;
        content: "";
      }

      main {
        display: grid;
        flex: 1;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.45fr);
        align-items: center;
        gap: clamp(48px, 9vw, 140px);
        width: 100%;
        max-width: 1360px;
        margin: 64px auto;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #bc5b35;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 850px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(4.4rem, 11vw, 9.5rem);
        font-weight: 400;
        letter-spacing: -0.07em;
        line-height: 0.8;
      }

      h1 span {
        color: #bc5b35;
        font-style: italic;
      }

      .intro {
        padding-top: 22px;
        border-top: 1px solid #a8aea8;
      }

      .intro p {
        margin: 0;
        color: #46584d;
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.7;
      }

      .monogram {
        display: grid;
        width: 72px;
        height: 72px;
        margin-top: 38px;
        border: 1px solid #274c3a;
        border-radius: 50%;
        place-items: center;
        color: #274c3a;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        font-style: italic;
      }

      footer {
        padding-top: 22px;
        border-top: 1px solid #d2cec3;
        color: #59655d;
        font-size: 0.8rem;
      }

      footer p {
        margin: 0;
      }

      @media (max-width: 760px) {
        .shell {
          padding: 24px;
        }

        main {
          grid-template-columns: 1fr;
          align-content: center;
          gap: 52px;
          margin: 48px auto;
        }

        h1 {
          font-size: clamp(4.2rem, 24vw, 7rem);
        }

        footer p:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <p class="wordmark">Nifemi.</p>
        <span class="status">Online</span>
      </header>

      <main>
        <section aria-labelledby="page-title">
          <p class="eyebrow">A new corner of the web</p>
          <h1 id="page-title">Hello,<br /><span>world.</span></h1>
        </section>

        <section class="intro" aria-label="Introduction">
          <p>
            This is Nifemi's digital home. The foundation is live, the door is open, and there is more to come.
          </p>
          <div class="monogram" aria-hidden="true">N</div>
        </section>
      </main>

      <footer>
        <p>&copy; <span id="year">2026</span> Nifemi</p>
        <p>Built with intention</p>
      </footer>
    </div>
    <script>
      document.querySelector("#year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
